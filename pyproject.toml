[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rus-ablation"
version = "1.2.1"
description = "RUS — Remove Ur Refusal. Living refusal ablation engine for language models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ENI"}]
keywords = ["llm", "abliteration", "refusal", "alignment", "representation-engineering", "uncensored"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0,<3",
    "transformers>=4.48.0,<6",
    "accelerate>=0.30.0,<2",
    "rich>=13.0.0,<15",
    "numpy>=1.24.0,<3",
    "safetensors>=0.4.0,<1",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43.0"]
test = ["pytest>=8,<10"]

[project.scripts]
rus = "rus.cli:main"

[tool.setuptools.packages.find]
include = ["rus*"]
