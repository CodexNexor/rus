[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rus-ablation"
version = "1.0.5"
description = "RUS — Remove Ur Refusal. Living refusal ablation engine for language models."
readme = {text = "RUS — Remove Ur Refusal. Abliterate refusal from any HuggingFace LLM with one line of Python.", content-type = "text/plain"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ENI"}]
keywords = ["llm", "abliteration", "refusal", "alignment", "representation-engineering", "uncensored"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "tqdm>=4.65.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43.0"]

[project.scripts]
rus = "rus.cli:main"

[tool.setuptools.packages.find]
include = ["rus*"]
